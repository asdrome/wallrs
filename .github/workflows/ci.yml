name: CI

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------------------
  # FAST CHECKS: PR Gatekeeper
  # Obligatorio para PRs hacia main y post-merge. Salta si el PR es un Draft.
  # Nombre determinista 'pr-gatekeeper' para usar en Branch Protection Rules.
  # ---------------------------------------------------------------------------
  pr-gatekeeper:
    name: pr-gatekeeper
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || !github.event.pull_request.draft
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "wallrs-ci"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libvulkan-dev \
            libpipewire-0.3-dev \
            libmpv-dev \
            libwayland-dev

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace with Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

  # ---------------------------------------------------------------------------
  # HEAVY TASKS: Post-Merge Verification
  # Se ejecuta únicamente en push a 'main' tras mergear el PR.
  # Compila en release para asegurar que no existan regresiones de optimización.
  # ---------------------------------------------------------------------------
  post-merge-build:
    name: post-merge-build
    needs: pr-gatekeeper
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "wallrs-ci"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libvulkan-dev \
            libpipewire-0.3-dev \
            libmpv-dev \
            libwayland-dev

      - name: Verify release build
        run: cargo build --release --locked
