[wallpaper]
type = "image"
name = "parallax-with-audio"
author = "wallrs"
description = "Multi-layer parallax landscape with looping background ambient audio"

[[image.layers]]
path = "bg.png"

[[image.layers]]
path = "fg.png"
parallax = 0.5
pan = { speed = 0.005, axis = "x" }

[audio]
path = "ambient.ogg"
volume = 60.0
loop = true
